<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>📚 Flashcard Quiz</h1>
        <p class="subtitle">Learn • Practice • Remember</p>

        <div class="card">
            <div class="card-content">
                <h2 id="question">Question</h2>
                <p id="answer" class="hidden">Answer</p>
            </div>

            <button id="showAnswer">Show Answer</button>
        </div>

        <div class="navigation">
            <button id="previous">← Previous</button>
            <span id="counter">1 / 3</span>
            <button id="next">Next →</button>
        </div>

        <div class="management">
            <button id="addCard">＋ Add Card</button>
            <button id="editCard">✏️ Edit</button>
            <button id="deleteCard">🗑️ Delete</button>
        </div>

        <div id="formContainer" class="form-container hidden">
            <input type="text" id="questionInput" placeholder="Enter question">
            <input type="text" id="answerInput" placeholder="Enter answer">

            <button id="saveCard">Save Card</button>
            <button id="cancelForm">Cancel</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
